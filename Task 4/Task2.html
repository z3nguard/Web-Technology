<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUML Training Institute</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h2 class="mt-3">NUML</h2>

        <div class="row">

            <div class="col-lg-5">

                <h4 class="mt-4">Register Here</h4>

                <form>

                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control mb-2">

                    <label class="form-label">Email</label>
                    <input type="email" class="form-control mb-2">

                    <label class="form-label">Password</label>
                    <input type="password" class="form-control mb-2">

                    <label class="form-label">City</label>
                    <input type="text" class="form-control">

                    <h5 class="mt-3">Select Skills</h5>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">HTML</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">CSS</label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" disabled>
                        <label class="form-check-label">Bootstrap</label>
                    </div>

                    <button class="btn btn-primary mt-3">
                        Submit
                    </button>

                </form>

            </div>


            <div class="col-lg-7">

                <div class="text-center mt-4">

                    <img src="image.jpg" class="rounded-circle img-fluid" alt="Institute">

                    <h4 class="mt-2">NUML</h4>

                </div>

                <ul class="nav nav-pills mt-3">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">Overview</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Courses</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact</a>
                    </li>

                </ul>

                <p class="mt-3">
                    We offer different training courses for students
                    wanting to learn web development
                </p>

                <button class="btn btn-success">
                    view courses
                </button>

                <h5 class="mt-4">courses and fees</h5>

                <table class="table table-bordered">

                    <tr>
                        <th>course</th>
                        <th>fee</th>
                    </tr>

                    <tr>
                        <td>HTML</td>
                        <td>5000</td>
                    </tr>

                    <tr>
                        <td>CSS</td>
                        <td>6000</td>
                    </tr>

                    <tr>
                        <td>Bootstrap</td>
                        <td>8000</td>
                    </tr>

                </table>

            </div>

        </div>

    </div>

</body>

</html>
